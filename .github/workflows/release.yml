name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}

jobs:
  # Only build releases for tags carrying a valid SSH signature from a key
  # listed in .github/allowed_signers.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Verify tag signature
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config gpg.ssh.allowedSignersFile "$GITHUB_WORKSPACE/.github/allowed_signers"
          git verify-tag "${GITHUB_REF_NAME}"

  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  artifacts:
    needs: [ci, verify]
    name: ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [fdd, linux-x64, linux-arm64, win-x64]
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Package ${{ matrix.rid }}
        run: mise run package --rid "${{ matrix.rid }}" --version "${VERSION}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  container:
    needs: [ci, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          image="${REGISTRY}/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags=(--image "${image}:${GITHUB_REF_NAME}" --image "${image}:latest")
          else
            tags=(--image "${image}:sha-${GITHUB_SHA::7}")
          fi
          mise run container "${tags[@]}" --platforms linux/amd64,linux/arm64 --version "${VERSION}" --push

  # Collect every archive and attach them to the GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
